[tox]
envlist = py38,py39,py310,py311,py312,py313

[testenv]
deps = -rrequirements.txt
allowlist_externals = sh
# The environments run at the same time under `tox --parallel`, so each one gets
# its own temp directory and its own coverage data file rather than sharing the
# process-wide ones. fcache stages every cache write through tempfile.mkstemp(),
# and pytest's tmp_path lives under the same root. Coverage is disabled here; the
# `main` CI job is the single producer of test_results/cov.xml.
set_env =
    COVERAGE_FILE = {env_tmp_dir}/.coverage
    TMPDIR = {env_tmp_dir}
    TEMP = {env_tmp_dir}
    TMP = {env_tmp_dir}
commands =
    sh ./scripts/get-spec.sh
    py.test tests/unit_tests \
        --no-cov -p no:cacheprovider
    py.test tests/specification_tests \
        --no-cov -p no:cacheprovider
