[tox]
envlist = py38,py39,py310,py311,py312,py313

[testenv]
deps = -rrequirements.txt
allowlist_externals = sh
# pyproject.toml's [tool.pytest.ini_options] addopts always applies and points
# at the shared test_results/ directory, .coverage and .pytest_cache. Under
# `tox --parallel` every environment would race on those paths, so each one
# redirects its reports into {env_tmp_dir}. Coverage is disabled here; the
# `main` CI job is the single producer of test_results/cov.xml.
set_env =
    COVERAGE_FILE = {env_tmp_dir}/.coverage
commands =
    sh ./scripts/get-spec.sh
    py.test tests/unit_tests \
        --no-cov -p no:cacheprovider \
        --html={env_tmp_dir}/unit-results.html \
        --junitxml={env_tmp_dir}/unit-results.xml
    py.test tests/specification_tests \
        --no-cov -p no:cacheprovider \
        --html={env_tmp_dir}/spec-results.html \
        --junitxml={env_tmp_dir}/spec-results.xml
